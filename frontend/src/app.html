<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/logo-mark.png" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#0A0912" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="text-scale" content="scale" />
		<script>
			// Self-Healing Cache Recovery Engine:
			// If a browser has a stale Service Worker cache pointing to outdated immutable bundles,
			// automatically unregister service workers, purge cache storage, and reload fresh assets once.
			window.addEventListener('error', function(e) {
				var msg = (e && (e.message || (e.target && e.target.src))) || '';
				if (
					msg.indexOf('dynamically imported module') !== -1 ||
					msg.indexOf('Importing a module script failed') !== -1 ||
					msg.indexOf('Loading chunk') !== -1 ||
					msg.indexOf('Failed to fetch') !== -1
				) {
					if (!sessionStorage.getItem('diverge_cache_healed')) {
						sessionStorage.setItem('diverge_cache_healed', '1');
						if ('serviceWorker' in navigator) {
							navigator.serviceWorker.getRegistrations().then(function(regs) {
								for (var i = 0; i < regs.length; i++) regs[i].unregister();
								if ('caches' in window) {
									caches.keys().then(function(keys) {
										Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
											window.location.reload(true);
										});
									});
								} else {
									window.location.reload(true);
								}
							});
						} else {
							window.location.reload(true);
						}
					}
				}
			}, true);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">
			%sveltekit.body%
		</div>
	</body>
</html>
